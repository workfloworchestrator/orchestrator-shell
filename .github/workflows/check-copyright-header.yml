name: Verify copyright year in modified files

# Invoked indirectly from ci.yml; no push/pull_request trigger to avoid duplicate checks.
on:
  workflow_call:

jobs:
  copyright-check:
    name: Copyright headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify copyright year in modified files
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_YEAR="$(date +%Y)"

          # Determine base ref for the files this change touches
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_REF="${{ github.event.before }}"
            # A new branch reports the null object as "before"; there is nothing to compare then.
            if [[ "$BASE_REF" =~ ^0+$ ]] || ! git rev-parse --verify --quiet "$BASE_REF^{commit}" > /dev/null; then
              BASE_REF="$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)"
            fi
          else
            BASE_REF="$(git rev-parse HEAD~1)"
          fi

          MODIFIED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)

          FAIL=0

          for file in $MODIFIED_FILES; do
            # Skip deleted or non-regular files
            [[ -f "$file" ]] || continue

            # Only check Python files
            [[ "$file" == *.py ]] || continue

            # Only inspect the header (first 20 lines)
            if ! head -n 1 "$file" | grep -Eqi "# Copyright.*${CURRENT_YEAR}"; then
              echo "ERROR: $file does not contain a ${CURRENT_YEAR} copyright notice in the header"
              FAIL=1
            fi
          done

          if [[ "$FAIL" -ne 0 ]]; then
            exit 1
          fi
