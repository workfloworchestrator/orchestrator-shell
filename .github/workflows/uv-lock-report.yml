# Posts a readable report of the uv.lock changes on a pull request. Informational only: it is not
# part of the "CI result" gate (see ci.yml), so a report failure never blocks a merge.

name: Generate uv.lock report

on:
  pull_request:
    paths:
      - 'uv.lock'

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    name: uv.lock report (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mw-root/uv-lock-report@v0.14.1
        with:
          output-format: "table"
          github-token: ${{ secrets.GITHUB_TOKEN }}
