# Runs the Ruff check and format check and the type check on one Python version. They do not
# depend on the interpreter, so they run once instead of once per version in the test matrix.

name: Linting tests

# Invoked indirectly from ci.yml; no push/pull_request trigger to avoid duplicate checks.
on:
  workflow_call:

env:
  UV_LOCKED: true  # Assert that the `uv.lock` will remain unchanged

jobs:
  linting:
    name: Linting Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v10.3.0
        with:
          # Pin to the version that generated uv.lock, so `--locked` cannot fail on a format bump.
          version: "0.13.3"
          python-version: "3.13"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Check with ruff
        run: uv run --no-sync ruff check

      - name: Check formatting with ruff
        run: uv run --no-sync ruff format --check

      - name: Check with ty
        run: uv run --no-sync ty check
